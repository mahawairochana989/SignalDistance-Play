<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ЭЭГ · сцена заданий 1–5</title>
  <link rel="stylesheet" href="../styles.css" />
  <style>
    .scene-page { max-width: 900px; margin: 0 auto; }
    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .stages {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0 24px;
    }
    @media (max-width: 720px) {
      .stages { grid-template-columns: repeat(2, 1fr); }
    }
    .stage {
      border: 1px solid var(--line-strong);
      background: #0d0d0d;
      color: var(--text);
      border-radius: 16px;
      padding: 22px 10px;
      text-decoration: none;
      font-weight: 700;
      letter-spacing: -0.02em;
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s, transform 0.15s;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .stage:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 0 28px var(--accent-glow);
    }
    .stage .n {
      font-size: 1.6rem;
      line-height: 1;
    }
    .stage .l {
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.8;
      text-align: center;
    }
    .hint {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>
<body>
  <main class="wrap scene-page">
    <a class="back" href="../../index.html">← К симуляциям</a>
    <p class="muted small">Симуляция ЭЭГ · сцена из 5 экранов</p>
    <h1>Этапы <span class="hi">1–5</span></h1>
    <p class="hint">Нажмите экран N — откроется этап N. На самом экране ещё раз нажмите — появится задание N.</p>

    <div class="stages" id="stages" aria-label="Экраны этапов">
      <a class="stage" href="./1.html"><span class="n">1</span><span class="l">Экран → задача 1</span></a>
      <a class="stage" href="./2.html"><span class="n">2</span><span class="l">Экран → задача 2</span></a>
      <a class="stage" href="./3.html"><span class="n">3</span><span class="l">Экран → задача 3</span></a>
      <a class="stage" href="./4.html"><span class="n">4</span><span class="l">Экран → задача 4</span></a>
      <a class="stage" href="./5.html"><span class="n">5</span><span class="l">Экран → задача 5</span></a>
    </div>
  </main>
</body>
</html>
